<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Ejercicio de Personas</title>
</head>

<body>
    <!-- Person Data -->
    <div id="container">
        <header>
            <h1>Formulario Persona</h1>
        </header>
        <div id="form">
            <form>
                <input type="text" id="deadname" hidden />
                <label>
                    Nombre: <input type="text" id="name" />
                </label><br />
                <label>
                    Apellidos: <input type="text" id="surname" />
                </label><br>
                <label>
                    Dirección: <input type="text" id="direction" />
                </label><br>
                <label>
                    Fecha de Nacimiento: (yyyy-MM-dd) <input type="text" id="born-date" />
                </label><br>
                <label>
                    Género:<br>
                    <label for="women">Mujer:</label> <input type="radio" id="female" name="gender" value="Sra">
                    <label for="men">Hombre:</label> <input type="radio" id="male" name="gender" value="Sr">
                </label><br>
                <label>
                    Código Postal: <input type="text" id="code" />
                </label><br>
            </form>
        </div>

        <div id="buttons">
            <!-- Navigation Acctions -->
            <nav>
                <fieldset>
                    <legend>Navegación</legend>
                        <input type="button" id="first-btn" value="Primero">
                        <input type="button" id="previous-btn" value="<< Anterior">
                        <input type="button" id="next-btn" value="Siguiente >>">
                        <input type="button" id="last-btn" value="Último">
                </fieldset>
            </nav>

            <!-- CRUD Acctions -->
            <div id="crud">
                <input type="button" id="register-btn" value="Registrar">
                <input type="button" id="modify-btn" value="Modificar">
                <input type="button" id="delete-btn" value="Borrar">
                <input type="button" id="list-all-btn" value="Listar todos">
                <input type="button" id="list-current-btn" value="Listar Actual">
                <input type="button" id="accept-btn" value="Aceptar" hidden>
                <input type="button" id="cancel-btn" value="Cancelar" hidden>
            </div>
        </div>
    </div>
    <script type="module" src="./js/main.js"></script>
</body>

</html>
