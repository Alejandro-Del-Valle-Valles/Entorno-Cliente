<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Ejercicio de Personas</title>
</head>

<body>
    <!-- Person Data -->
    <div id="container">
        <form>
            <fieldset>
                <legend>Persona</legend>
                <label>
                    Nombre: <input type="text" id="name" />
                </label><br />
                <label>
                    Apellidos: <input type="text" name="surname" />
                </label><br>
                <label>
                    Dirección: <input type="text" name="direction" />
                </label><br>
                <label>
                    Fecha de Nacimiento: <input type="text" name="born-date" />
                </label><br>
                <label>
                    Género:
                    Mujer: <input type="radio" name="gender" value="Sra">
                    Hombre: <input type="radio" name="gender" value="Sr">
                </label><br>
                <label>
                    Código Postal: <input type="text" name="code" />
                </label><br>
            </fieldset>
        </form>

        <!-- Navigation Acctions -->
        <div>
            <fieldset>
                <legend>Navegación</legend>
                    <input type="button" id="first-btn" value="Primero">
                    <input type="button" id="previous-btn" value="<< Anterior">
                    <input type="button" id="next-btn" value="Siguiente >>">
                    <input type="button" id="last-btn" value="Último">
            </fieldset>
        </div>

        <!-- CRUD Acctions -->
        <div>
            <fieldset>
                <legend>Administración</legend>
                    <input type="button" id="register-btn" value="Registrar">
                    <input type="button" id="modify-btn" value="Modificar">
                    <input type="button" id="delete-btn" value="Borrar">
                    <input type="button" id="list-all-btn" value="Listar todos">
                    <input type="button" id="list-current-btn" value="Listar Actual">
                    <input type="button" id="accept-btn" value="Aceptar" hidden>
                    <input type="button" id="cancel-btn" value="Cancelar" hidden>
            </fieldset>
        </div>
    </div>
    <script type="module" src="./js/main.js"></script>
</body>

</html>
